resources:
  jobs:
    batch_pipeline:
      name: batch_pipeline
      job_clusters:
        - job_cluster_key: main_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: Standard_DC4as_v5
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*, 4]"
            custom_tags:
              ResourceClass: SingleNode
      tasks:
        - task_key: bronze_batch
          job_cluster_key: main_cluster
          notebook_task:
            notebook_path: ../notebooks/nb_bronze_databricks.ipynb
            base_parameters:
              catalog: ${var.catalog}
        - task_key: silver_batch
          job_cluster_key: main_cluster
          depends_on: [{task_key: bronze_batch}]
          notebook_task:
            notebook_path: ../notebooks/nb_silver_databricks.ipynb
            base_parameters:
              catalog: ${var.catalog}
        - task_key: generate
          job_cluster_key: main_cluster
          depends_on: [{task_key: silver_batch}]
          notebook_task:
            notebook_path: ../notebooks/nb_generate_databricks.ipynb
            base_parameters:
              catalog: ${var.catalog}
        - task_key: gold_batch
          job_cluster_key: main_cluster
          depends_on: [{task_key: generate}]
          notebook_task:
            notebook_path: ../notebooks/nb_gold_databricks.ipynb
            base_parameters:
              catalog: ${var.catalog}
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: America/Toronto
        pause_status: UNPAUSED