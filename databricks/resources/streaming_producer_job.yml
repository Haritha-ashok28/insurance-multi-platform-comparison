resources:
  jobs:
    streaming_producer_job:
      name: streaming_producer_job
      job_clusters:
        - job_cluster_key: producer_cluster
          new_cluster:
            spark_version: 17.3.x-scala2.13
            node_type_id: Standard_DC4as_v5
            num_workers: 0
            data_security_mode: SINGLE_USER
            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: "local[*, 4]"
            custom_tags:
              ResourceClass: SingleNode
      tasks:
        - task_key: streaming_producer
          job_cluster_key: producer_cluster
          notebook_task:
            notebook_path: ../notebooks/nb_streaming_producer.ipynb
            base_parameters:
              catalog: ${var.catalog}
      schedule:
        quartz_cron_expression: "0 45 7 24 9 ? 2026"
        timezone_id: America/Toronto
        pause_status: UNPAUSED
